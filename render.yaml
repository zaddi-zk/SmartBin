services:
  - type: web
    name: SmartBin
    env: python
    region: oregon
    plan: free  # $0/mo - budget conscious (can go negative if needed)
    branch: main
    autoDeploy: true
    buildCommand: |
      python -m venv .venv
      . .venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: cd /opt/render/project/src && . .venv/bin/activate && python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /home/render/smartbin.db
      - key: DATABASE_URL
        sync: false  # Supabase/Postgres URL; when set it overrides DB_PATH
      - key: MINIAPP_PORT
        value: "8080"
      - key: MINIAPP_BASE
        sync: false  # Add your Mini App URL here: https://your-domain.onrender.com
      - key: STRIPE_API_KEY
        sync: false  # ⚠️ MUST SET IN RENDER DASHBOARD - Your Stripe secret key (sk_live_...)
      - key: STRIPE_TEST_MODE
        value: "0"  # LIVE MODE for real checks
      - key: FREE_BINS_PER_DAY
        value: "3"
      - key: FREE_CHECKS_PER_DAY
        value: "2"
      - key: LOG_LEVEL
        value: WARNING  # less logging = faster
      - key: PYTHONPATH
        value: /opt/render/project/src
    disk:
      name: smartbin-data
      mountPath: /home/render
      sizeGB: 1
