services:
  - type: web
    name: SmartBin
    env: python
    region: oregon
    plan: free  # $0/mo - budget conscious (can go negative if needed)
    branch: main
    autoDeploy: true
    # One poller per token. A second instance makes Telegram answer 409
    # ("terminated by other getUpdates request") and splits updates between
    # them. Never scale this service past one instance.
    numInstances: 1
    # Gives Render a real health signal, and keeps the old instance alive until
    # this one answers /healthz. The app also binds the port before its slow
    # boot work and delays the first poll so the two never fight over getUpdates.
    healthCheckPath: /healthz
    buildCommand: |
      python -m venv .venv
      . .venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: cd /opt/render/project/src && . .venv/bin/activate && python -m app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BOT_TOKEN
        sync: false
      # Beast platform DB. DB_URL wins over DATABASE_URL (AliasChoices order):
      # the legacy Supabase tables (users/checks) have different schemas, so
      # the platform starts on its own SQLite on the disk mount. Postgres
      # cutover is a later step — never point both stacks at one schema.
      - key: DB_URL
        value: sqlite+aiosqlite:////home/render/venice.db
      - key: DB_PATH
        value: /home/render/smartbin.db
      - key: DATABASE_URL
        sync: false  # Supabase/Postgres URL; when set it overrides DB_PATH
      # Read-only source for the one-time legacy import (public.users).
      # Optional: when unset, DATABASE_URL is used if it points at a different
      # Postgres than DB_URL. Never set this to the platform's own URL.
      - key: LEGACY_DATABASE_URL
        sync: false
      # Required with DATABASE_URL: the platform's own schema. The legacy
      # users/checks tables live in public, so never leave this empty or point
      # it at public. Boot creates it if missing and pins search_path.
      - key: DB_SCHEMA
        value: smartbin
      # Seed pool imported at boot and re-pulled once a day. Rows stay
      # untestable until the tick has answered api.ipify.org through them.
      - key: PROXY_SEED_FILE
        value: data/proxies.txt
      - key: MINIAPP_PORT
        value: "8080"
      - key: MINIAPP_BASE
        sync: false  # Add your Mini App URL here: https://your-domain.onrender.com
      - key: STRIPE_API_KEYS
        sync: false  # One or more keys, comma/newline separated; rotated on 401/403/429
      - key: STRIPE_API_KEY
        sync: false  # Legacy single key; merged with STRIPE_API_KEYS when both are set
      # A5-sized test card used only to measure 3DS on a BIN. Without it the
      # "Measure 3DS" button is hidden instead of failing after a tap.
      - key: CANARY_CARDS
        sync: false  # pan|mm|yy|cvv|postal, one per line; no real customer cards
      - key: STRIPE_TEST_MODE
        value: "0"  # LIVE MODE for real checks
      - key: FREE_BINS_PER_DAY
        value: "3"
      - key: FREE_CHECKS_PER_DAY
        value: "2"
      - key: LOG_LEVEL
        value: WARNING  # less logging = faster
      - key: PYTHONPATH
        value: /opt/render/project/src
    disk:
      name: smartbin-data
      mountPath: /home/render
      sizeGB: 1
