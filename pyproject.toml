[project]
name = "venice-check"
version = "1.0.0"
description = "Card verification platform: terminal verdicts, honest gates, idempotent ledger."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "S311", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
exclude = ["smartbin/", "tools/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["app.tg.*"]
# aiogram's handler decorators erase callable types; the screens are covered by
# ruff plus the integration smoke test instead.
disallow_untyped_decorators = false
warn_return_any = false
# CallbackQuery.message is Message | InaccessibleMessage; every handler already
# rejects None, and aiogram never delivers an inaccessible message to a bot that
# owns the chat. Narrowing all 37 call sites would only add noise.
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
